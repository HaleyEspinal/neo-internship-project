    function breakPlat1Check(){
        // prevents breaking from below
        if (player.y >= (breakPlat1.y - breakPlat1.height/2)){
            return;
        }
        breakPlat1Touched = true;
        onBreakPlat = true;
    }

    function mushCheck(){
        mushTouched = true;
    }

    function platTouch(){
        mushTouched = false;
    }

    function leverFlipped(){

        // checked if switch is about to make the player grow from a shrunk size
        if (shrinkLatch === true){
            player.y -= 15;
            player.setBounce(0);
            player.body.setGravityY(0);
            shrinkLatch = false;
        }

        // changes all extRules to false. "key" could be any word
        for (let key in extRules){
            extRules[key] = false;
        }
       
        // if leverDir === left ?, then use leverIconD, else: use leverIconU
        switch(leverDir === 'down' ? leverTypeD : leverTypeU){
            case 0:
                break;
            case 1:
                extRules.colorBlue = true;
                break; 
            case 2:
                extRules.shrink = true;
                shrinkLatch = true;
                player.setBounce(0.1);
                player.body.setGravityY(-250);
                break;
            case 3:
                extRules.doubleJump = true;
                break;
            case 4:
                extRules.wifi = true;
                break;
        }

        colorPlatCheck();
       }

    function keyCollect(){
        key.disableBody(true, true);
        goal.setFrame(0);
        goalOpen = true;
        keySound.play();
    }

    function goalReached(scene){
        if (!goalOpen){
            return;
        }
        goalOpen = false;
        goalSound.play();

        lvlTran = true;

        goalSign.setPosition(sky.x, sky.y);
        scene.time.delayedCall(1300, () => {
            goalSign.setPosition(0, -900);
            platforms.clear(true, true);
            mold.clear(true, true);
            bluePlatforms.clear(true, true);

            player.setVelocityY(0);

            platSize.h1 = 25;
            platSize.w2 = 300;
            platSize.h2 = 25;
            platSize.w3 = 300;
            platSize.h3 = 25;
            platSize.w4 = 300;
            platSize.h4 = 25;
            platSize.w5 = 300;
            platSize.h5 = 25;
            breakPlatSize.w1 = 80;
            breakPlatSize.h1 = 25;
            colorPlatSize.blueW1 = 80;
            colorPlatSize.blueH1 = 25;

            
            levelSetup();
            leverFlipped();

            safeSpotX = player.x;
            safeSpotY = player.y;
            lvlTran = false;

                colorPlatSize.blueW1 = 35;

                colorPlatPos.blueX1 = 1375;
                colorPlatPos.blueY1 = 60;
                leverPos.x = 1050;
                leverPos.y = -220;
                leverTypeU = 1;
                leverTypeD = 4;
                break;
            case 14:
                playerPos.x = 350;
                playerPos.y = -150;
                platSize.w1 = 270;
                platSize.h1 = 25;
                platPos.x1 = 335;
                platPos.y1 = -80;
                platSize.w2 = 148;
                platSize.h2 = 25;
                platPos.x2 = 84;
                platPos.y2 = -80;
                platSize.h3 = 25;
                platSize.w3 = 500;
                platPos.x3 = 100;
                platPos.y3 = 220;
                platSize.h4 = 150;
                platSize.w4 = 90;
                platPos.x4 = 55;
                platPos.y4 = -168;
                mushPos.x = -60;
                mushPos.y = 193;
                keyPos.x = 180;
                keyPos.y = -20;
                goalOpen = false;
                goalPos.x = -200;
                goalPos.y = -200;
                breakPlatSize.h1 = 25;
                breakPlatSize.w1 = 80;
                breakPlatPos.x1 = 180;
                breakPlatPos.y1 = -55;
                leverPos.x = 1050;

                leverTypeD = 2;
                break;
            case 15:

                playerPos.y = 20;
                platSize.h1 = 100;
                platSize.w1 = 70;
                platPos.x1 = 690;
                platPos.y1 = 335;
                platSize.h2 = 50;
                platSize.w2 = 620;
                platPos.x2 = 160;
                platPos.y2 = 240;
                platSize.h3 = 25;
                platSize.w3 = 150;
                platPos.x3 = 180;
                platPos.y3 = 120;
                platSize.h4 = 200;
                platSize.w4 = 50;
                platPos.x4 = -250;
                platPos.y4 = -10;
                platSize.h5 = 50;
                platSize.w5 = 280;
                platPos.x5 = -325;
                platPos.y5 = 150;
                mushPos.x = -420;
                mushPos.y = 110;
                keyPos.x = -250;
                keyPos.y = -150;
                colorPlatSize.blueH1 = 100;
                colorPlatSize.blueW1 = 250;
                colorPlatPos.blueX1 = 1125;
                colorPlatPos.blueY1 = 332;
                goalOpen = false;
                goalPos.x = 1125;
                goalPos.y = 135;
                breakPlatSize.h1 = 25;
                breakPlatSize.w1 = 160;
                breakPlatPos.x1 = 400;
                breakPlatPos.y1 = 40;
                leverPos.x = 1050;
                leverPos.y = -220;
                leverTypeU = 1;
                leverTypeD = 2;
                break;
        }
        // move player
        player.setPosition(sky.x + playerPos.x, sky.y + playerPos.y);

        // goal
        goal.setPosition(sky.x + goalPos.x, sky.y + goalPos.y, 'goal');
        if (goalOpen){
            goal.setFrame(0);
        } else {
            goal.setFrame(1);
        }

        // key
        key.setPosition(sky.x + keyPos.x, sky.y + keyPos.y, 'key');

        // mushroom spring
        mushroom.setPosition(sky.x + mushPos.x, sky.y + mushPos.y, 'mushroom');

        // main ground
        // platforms.create(sky.x, (sky.y + sky.displayHeight/2 - 20), 'ground').setDisplaySize(936, 40).refreshBody();

        // other platforms
        plat1 = platforms.create(sky.x + platPos.x1, sky.y + platPos.y1, 'ground').setDisplaySize(platSize.w1, platSize.h1).refreshBody();
        plat2 = platforms.create(sky.x + platPos.x2, sky.y + platPos.y2, 'ground').setDisplaySize(platSize.w2, platSize.h2).refreshBody();
        plat3 = platforms.create(sky.x + platPos.x3, sky.y + platPos.y3, 'ground').setDisplaySize(platSize.w3, platSize.h3).refreshBody();
        plat4 = platforms.create(sky.x + platPos.x4, sky.y + platPos.y4, 'ground').setDisplaySize(platSize.w4, platSize.h4).refreshBody();
        plat5 = platforms.create(sky.x + platPos.x5, sky.y + platPos.y5, 'ground').setDisplaySize(platSize.w5, platSize.h5).refreshBody();
        plat6 = platforms.create(sky.x + platPos.x6, sky.y + platPos.y6, 'ground').setDisplaySize(platSize.w6, platSize.h6).refreshBody();
        plat7 = platforms.create(sky.x + platPos.x7, sky.y + platPos.y7, 'ground').setDisplaySize(platSize.w7, platSize.h7).refreshBody();
        plat8 = platforms.create(sky.x + platPos.x8, sky.y + platPos.y8, 'ground').setDisplaySize(platSize.w8, platSize.h8).refreshBody();
        plat9 = platforms.create(sky.x + platPos.x9, sky.y + platPos.y9, 'ground').setDisplaySize(platSize.w9, platSize.h9).refreshBody();




        // breakaway platforms
        breakPlat1.setPosition(sky.x + breakPlatPos.x1, sky.y + breakPlatPos.y1, 'breakPlat').setDisplaySize(breakPlatSize.w1, breakPlatSize.h1).refreshBody();

        // color platforms
        colorPlatCheck();

        // switches depths for specific levels (mostly issue with monitor 2)
        if (level === 13 || level === 15){
            plat1.setDepth(3);
        }
        else{
            plat1.setDepth(0);
        }
        

        // mold
        let moldAtexture3 = 'mold';
        let moldAtexture4 = 'mold';
        let moldAtexture5 = 'mold';

        moldPos.x2 = (moldPos.x1 + 24);
        moldPos.x3 = (moldPos.x2 + 24);
        moldPos.x4 = (moldPos.x3 + 24);
        moldPos.x5 = (moldPos.x4 + 24);

        if (moldChainA <= 3){
            moldAtexture3 = 'moldEdge';
        } else {
            moldAtexture3 = 'mold';
        }
        if (moldChainA === 4){
            moldAtexture4 = 'moldEdge';
        } else {
            moldAtexture4 = 'mold';
        }
        if (moldChainA >= 5){
            moldAtexture5 = 'moldEdge';
        } else {
            moldAtexture5 = 'mold';
        }
        mold.create(sky.x + moldPos.x1, sky.y + moldPos.y, 'moldEdge').setFlipX(true);
        mold.create(sky.x + moldPos.x2, sky.y + moldPos.y, 'mold');
        mold.create(sky.x + moldPos.x3, sky.y + moldPos.y, moldAtexture3);
        rightMold = moldPos.x3;
        if (moldChainA >= 4){
        mold.create(sky.x + moldPos.x4, sky.y + moldPos.y, moldAtexture4);
        rightMold = moldPos.x4;
        }
        if (moldChainA >= 5){
        mold.create(sky.x + moldPos.x5, sky.y + moldPos.y, moldAtexture5);
        rightMold = moldPos.x5;
        }

        //EXTERNAL
        leverDir = 'up';
        lever.setFrame(0);
        lever.setPosition(sky.x + leverPos.x, sky.y + leverPos.y, 'lever');
        leverIconD.setPosition(sky.x + leverPos.x, sky.y + leverPos.y+135, 'leverIcon');
        leverIconD.setFrame(leverTypeD);
        leverIconU.setPosition(sky.x + leverPos.x, sky.y + leverPos.y-135, 'leverIcon');
        leverIconU.setFrame(leverTypeU);

        // refresh collison hitboxes
        breakPlat1.refreshBody();
        mushroom.refreshBody();
        goal.refreshBody();
        key.refreshBody();
    }

    function colorPlatCheck(){
        bluePlatforms.clear(true, true);
        if (extRules.colorBlue === true){
            if (level === 13 || level === 15){
            bluePlatforms.create(sky.x + colorPlatPos.blueX1, sky.y + colorPlatPos.blueY1, 'colorPlat').setTint(0x0062ff).setDisplaySize(colorPlatSize.blueW1, colorPlatSize.blueH1).refreshBody().setDepth(3);
            }
            else{
            bluePlatforms.create(sky.x + colorPlatPos.blueX1, sky.y + colorPlatPos.blueY1, 'colorPlat').setTint(0x0062ff).setDisplaySize(colorPlatSize.blueW1, colorPlatSize.blueH1).refreshBody().setDepth(1);
            }
            blueCollider.active = true;
        } else {
            if (level === 13 || level === 15){
            bluePlatforms.create(sky.x + colorPlatPos.blueX1, sky.y + colorPlatPos.blueY1, 'colorPlat').setTint(0x6ea6ff).setDisplaySize(colorPlatSize.blueW1, colorPlatSize.blueH1).refreshBody().setDepth(3);
            }
            else{
            bluePlatforms.create(sky.x + colorPlatPos.blueX1, sky.y + colorPlatPos.blueY1, 'colorPlat').setTint(0x6ea6ff).setDisplaySize(colorPlatSize.blueW1, colorPlatSize.blueH1).refreshBody().setDepth(1);
            }
            blueCollider.active = false;
        }
    }

    function springUp(){
        if (player.body.touching.down && mushroom.body.touching.up && player.y <= (mushroom.y - mushroom.height/2)){
            player.setVelocityY(-650);
            cJump = false;
        }
    
        mushCheck();
        springSound.play();
    }

    function playerDie(scene){
        dying = true;
        if (safeSpotX < player.x){
            player.x = safeSpotX - 50;
        }
        else{
        player.x = safeSpotX + 50;
        }    
        player.y = (safeSpotY-15);
        player.setVelocityY(0);
        dieSound.play();

        // red flash
        // need to use "scene" because "this" is outside of function
        scene.time.delayedCall(0, () => {
            player.setTint('0xff5454');
        })
        scene.time.delayedCall(150, () => {
            player.clearTint();
        })
        scene.time.delayedCall(300, () => {
            player.setTint('0xff5454');
        })
        scene.time.delayedCall(450, () => {
            player.clearTint();
        })
        dying = false;
    }

    function update(){
        // MOVEMENT WALKING
        if (cursors.left.isDown){
            player.setVelocityX(-190);
            player.anims.play('left', true);
        }
        else if (cursors.right.isDown){
            player.setVelocityX(190);
            player.anims.play('right', true);
        }
        else{
            player.setVelocityX(0);
            player.anims.play('front', true);
        }

        // LEVEL TRANSITION
        if (lvlTran){
            goalSign.anims.play('goalSign', true);
        }

        // SAFESPOT
        // safespot only taken if player is far enough from mold edge
        if (((player.x <= (sky.x + moldPos.x1 - 12 - 50)) || (player.x >= (sky.x + rightMold + 12 + 50))) && !breakPlat1Touched && !mushTouched && player.body.touching.down && !dying){
            safeSpotX = player.x;
            safeSpotY = player.y;
        }

        // FALLS IN PIT
        if (player.y >= (sky.y + sky.displayHeight/2) && player.x <= (sky.x + sky.displayWidth/2) && player.x >= (sky.x - sky.displayWidth/2) 
            || player.y >= (sky.y + sky.displayHeight/2 + 200)){
            playerDie(this);
        }
     
        // JUMP
        if (cursors.up.isDown && (player.body.touching.down || cJump === true)){
            if (extRules.shrink){
                player.setVelocityY(-425);
                jumpSound.play({rate:1.5});
            } else {
                player.setVelocityY(-400);
                jumpSound.play();
            }
            cJump = false;
        }

        if (extRules.doubleJump && cursors.up.isUp && !player.body.touching.down){
            doubleJumpAv = true;
        }

        // SHRINK
        if (extRules.shrink){
            player.setScale(0.5);
        } else {
            player.setScale(0.75);
        }

        // DOUBLE JUMP
        if (cursors.up.isDown && !player.body.touching.down && doubleJumpAv && !doubleJumpStop && extRules.doubleJump){
            player.setVelocityY(-400);
            cJump = false;
            doubleJumpAv = false;
            doubleJumpStop = true;
            jumpSound.play();
        }

        // WIFI
        if (extRules.wifi){
            deskBkr.setFrame(1);
        }
        else {
            deskBkr.setFrame(0);
        }

        // coyote jump. If player is NOT touching down
        if (!player.body.touching.down){
            // coyote jump timer
            // "=>" go to these commands
            this.time.delayedCall(100, () => {
                cJump = false;
            })
        }

        if (player.body.touching.down){
            cJump = true;
            doubleJumpAv = false;
            doubleJumpStop = false;
        }

        // BREAKAWAY PLATFORMS
        // -30 accounts for bounce
        if (!onBreakPlat && breakPlat1Touched && 
        (player.y <= (breakPlat1.y - breakPlat1.height/2 - 30) || 
        player.y >= (breakPlat1.y + breakPlat1.width/2) ||
        player.x >= (breakPlat1.x + breakPlat1.width/2) || 
        player.x <= (breakPlat1.x - breakPlat1.width/2)
        )
        ){
            breakPlat1.disableBody(true,true);
            breakPlat1Touched = false;
            breakSound.play();
        }
        onBreakPlat = false;

        // LEVER PROXIMITY
        if (player.x <= (lever.x+lever.width/2 + 50) &&
            player.x >= (lever.x-lever.width/2 - 50) &&
            player.y <= (lever.y+lever.height/2 + 30) &&
            player.y >= (lever.y-lever.height/2 - 30)
            ){
                leverInt = true;
            }
            else{
                lever.clearTint();
                leverInt = false;
            }

        if (leverInt === true){
            lever.setTint('0xffe799');
            xButton.setPosition(player.x, player.y - player.height/2 - 10);
        }
        else{
            xButton.setPosition(0, -900);
        }

        if (leverInt === true && Phaser.Input.Keyboard.JustDown(enterKey)){
            if (leverDir === 'up'){
                lever.setFrame(1);
                leverDir = 'down';
            }
            else if (leverDir === 'down'){
                lever.setFrame(0);
                leverDir = 'up';
            }
            leverFlipped();
            switchSound.play();
        }

        if (Phaser.Input.Keyboard.JustDown(pKey)){
            levelSetup();
            leverFlipped();
            leverDir = 'up';
        }

        // TESTS
        if (Phaser.Input.Keyboard.JustDown(zeroKey)){
            extRules.colorBlue = !extRules.colorBlue;
            colorPlatCheck();
        }

        testText.setText ('Blue: ' + extRules.colorBlue);
        cursorText.setText ('Mouse: ' + this.input.activePointer.x + ', ' + this.input.activePointer.y);

        // console.log('extRules.doubleJump', extRules.doubleJump, doubleJumpAv);
    }
    


</script>
