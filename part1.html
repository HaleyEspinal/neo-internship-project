<!doctype html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8" />
    <title>Dust Bunny Adventures</title>
    <script src="//cdn.jsdelivr.net/npm/phaser@3.11.0/dist/phaser.js"></script>
    <style type="text/css">
        body {
            margin: 0;
        }
    </style>
</head>
<body>

<script type="text/javascript">
    var gameOver = false;
    let cJump = true;
    let airTime = 0;
    // level 0 for testing
    let level = 1;
    let levelText;
    let cursorText;
    let safeSpotX;
    let safeSpotY;
    let moldChainA = 3;
    let rightMold;
    let breakPlat1Touched;
    let onBreakPlat;
    let blueCollider;
    let leverInt = false;
    let leverDir = 'up';
    let leverTypeD = 0;
    let leverTypeU = 0;
    let doubleJumpAv = false;
    let doubleJumpStop = true;
    let shrinkLatch = false;
    let sky;
    let goalOpen = true;

    // this is an object, not an array
    // example of call: platPosition.x1
    let extRules = {
        doubleJump: false,
        colorBlue: false,
        shrink: false,
    }

    let playerPos = {
        x: 0,
        y: 0,
    }

    let platSize = {
        w1: 300,
        h1: 25,
        w2: 300,
        h2: 25,
        w3: 300,
        h3: 25,
        w4: 300,
        h4: 25,
        w5: 300,
        h5: 25,
        // plats 6, 7 and 8 are used for permennat external platforms
        w6: 720,
        h6: 25,
        w7: 730,
        h7: 25,
        w8: 880,
        h8: 15,
    }

    let platPos = {
        x1: 0,
        y1: -900,
        x2: 0,
        y2: -900,
        x3: 0,
        y3: -900,
        x4: 0,
        y4: -900,
        x5: 0,
        y5: -900,
        x6: 970,
        y6: -25,
        x7: 1010,
        y7: 400,
        x8: -10,
        y8: -258,
    }

    let breakPlatPos = {
        x1: 0,
        y1: 0,
    }

    let colorPlatPos = {
        blueX1: 0,
        blueY1: -900,
    }

    let mushPos = {
        x: 0,
        y: -900,
    }

    let moldPos = {
        y: -900,
        x1: 0,
        x2: 0,
        x3: 0,
        x4: 0,
        x5: 0,
    }

    let goalPos = {
        x: 0,
        y: -900,
    }

    let keyPos = {
        x: 0,
        y: -900,
    }

    let leverPos = {
        x: 0,
        y: -900,
    }

    var config = {
        type: Phaser.AUTO,
        // factor of 216 for resolution 16 by 9 ratio
        width: 3456,
        height: 1944,
        backgroundColor: '0x120c06',
        physics: {
            default: 'arcade',
            arcade: {
                gravity: { y: 750 },
                debug: false
            }
        },
        scene: {
            preload: preload,
            create: create,
            update: update
        }
    };

    var game = new Phaser.Game(config);

    function preload ()
    {
        this.load.image('deskBkr', 'assets/deskBkr.png');
        this.load.image('extBkr', 'assets/extBkr.png');
        this.load.image('projRef', 'projectionRef.jpg')
        this.load.image('sky', 'assets/sky.png');
        this.load.image('ground', 'assets/platform.png');
        this.load.image('breakPlat', 'assets/breakPlat.png');
        this.load.image('colorPlat', 'assets/colorPlat.png');
        this.load.image('mushroom', 'assets/mushroom.png');
        this.load.image('mold', 'assets/mold.png');
        this.load.image('moldEdge', 'assets/moldEdge.png');
        this.load.spritesheet('bunny',
            'assets/bunny.png',
            { frameWidth: 36, frameHeight: 32, spacing: 4}
        );
        this.load.spritesheet('goal', 'assets/goal.png',
            { frameWidth: 32, frameHeight: 32 }
        );
        this.load.spritesheet('lever', 'assets/lever.png',
            {frameWidth: 174, frameHeight: 324}
        );
        this.load.spritesheet('leverIcon', '/assets/leverIcons.png',
            {frameWidth: 128, frameHeight: 128}
        );
        this.load.image('key', 'assets/key.png');
    }

    function create ()
    {
        //scale to match resolution ratio
        // this.add.image(0, 0, 'projRef').setOrigin(0,0).setScale(2.16); 
        sky = this.add.image(650, 932, 'sky').setDisplaySize(936, 487);
        // sky.setTint('0xffffff').setAlpha(0.5);

        // 2nd monitor background
        deskBkr = this.add.image(sky.x + 1025, sky.y + 198, 'deskBkr').setScale(0.43).setDepth(2);

        // goal
        goal = this.physics.add.staticSprite(0, 0, 'goal').setDepth(3).setFrame(0).setScale(1.5);

        // key
        key = this.physics.add.staticSprite(0, 0, 'key').setScale(1.25);

        //mushroom spring
        mushroom = this.physics.add.staticSprite(0, 0, 'mushroom');

        // platforms
        platforms = this.physics.add.staticGroup();

        // breakaway platforms created
        breakPlat1 = this.physics.add.staticSprite(0, 0, 'breakPlat');

        // color platforms
        bluePlatforms = this.physics.add.staticGroup();

        // mold
        mold = this.physics.add.staticGroup();

        // exterior backdrop [REMOVE TO TEST]
        extBkr = this.add.image(sky.x, sky.y, 'extBkr').setDepth(1);

        // lever
        lever = this.physics.add.staticSprite(0, 0, 'lever').setDepth(1).setScale(0.5);
        leverIconD = this.physics.add.staticSprite(0, 0, 'leverIcon').setFrame(0).setDepth(5).setScale(0.75);
        leverIconU = this.physics.add.staticSprite(0, 0, 'leverIcon').setFrame(0).setDepth(5).setScale(0.75);

        // player
        player = this.physics.add.sprite(1700, 1700, 'bunny').setScale(1.5);
        player.setBounce(0);
        player.setCollideWorldBounds(true);
        player.setDepth(4);

        this.anims.create({
            key: 'left',
            frames: this.anims.generateFrameNumbers('bunny', { start: 0, end: 3 }),
            frameRate: 10,
            repeat: -1
        });

        this.anims.create({
            key: 'front',
            frames: [ { key: 'bunny', frame: 4 } ],
            frameRate: 20
        });

        this.anims.create({
            key: 'right',
            frames: this.anims.generateFrameNumbers('bunny', { start: 5, end: 8 }),
            frameRate: 10,
            repeat: -1
        });

        // collision and overlaps
        this.physics.add.collider(player, platforms);
        this.physics.add.collider(player, breakPlat1, breakPlat1Check, null, this);
        blueCollider = this.physics.add.collider(player, bluePlatforms);
        this.physics.add.overlap(player, goal, goalReached, null, this);
        this.physics.add.collider(player, mushroom, springUp, null, this);
        this.physics.add.overlap(player, mold, moldTouch, null, this);
        this.physics.add.overlap(player, key, keyCollect, null, this);

        // keyboard inputs
        cursors = this.input.keyboard.createCursorKeys();
        zeroKey = this.input.keyboard.addKey('ZERO');
        enterKey = this.input.keyboard.addKey('ENTER');

        // text
        testText = this.add.text(16, 20, 'Blue: ', {fontSize: '32px', fill: '#ffffff'})
        levelText = this.add.text(16, 50, 'Level: 1', {fontSize: '32px', fill: '#ffffff'})
        cursorText = this.add.text(16, 80, 'Mouse: ', {fontSize: '32px', fill: '#ffffff'})
        

        levelSetup();
        leverFlipped();
    }

    function breakPlat1Check(){
        breakPlat1Touched = true;
        onBreakPlat = true;
    }

    function leverFlipped(){

        // checked if switch is about to make the player grow from a shrunk size
        if (shrinkLatch === true){
            player.y -= 15;
            player.setBounce(0);
            player.body.setGravityY(0);
            shrinkLatch = false;
        }

        // changes all extRules to false. "key" could be any word
        for (let key in extRules){
            extRules[key] = false;
        }
       
        // if leverDir === left ?, then use leverIconD, else: use leverIconU
        switch(leverDir === 'down' ? leverTypeD : leverTypeU){
            case 0:
                extRules.doubleJump = true;
                break;
            case 1:
                extRules.colorBlue = true;
                break; 
            case 2:
                extRules.shrink = true;
                shrinkLatch = true;
                player.setBounce(0.1);
                player.body.setGravityY(-250);
                break;
        }

        colorPlatCheck();
       }

    function keyCollect(){
        key.disableBody(true, true);
        goal.setFrame(0);
        goalOpen = true;
    }

    function goalReached(){
        if (!goalOpen){
            return;
        }
        platforms.clear(true, true);
        mold.clear(true, true);
        bluePlatforms.clear(true, true);
        level += 1;
        levelText.setText ('Level: ' + level);
        player.setVelocityX(0);
        player.setVelocityY(0);

        // resets platform sizes to default
        platSize.w1 = 300;
        platSize.h1 = 25;
        platSize.w2 = 300;
        platSize.h2 = 25;
        platSize.w3 = 300;
        platSize.h3 = 25;
        platSize.w4 = 300;
        platSize.h4 = 25;
        platSize.w5 = 300;
        platSize.h5 = 25;

        levelSetup();
        leverFlipped();
        safeSpotX = player.x;
        safeSpotY = player.y;
        
 

        // re-enables the breakaway platform, 0 0 is ignored because of first parameter
        breakPlat1.enableBody(false, 0, 0, true, true);
        key.enableBody(false, 0, 0, true, true);
    }

    function levelSetup(){
        // moves all objects out of view
                playerPos.y = -1900;
                platPos.y1 = -1900;
                platPos.y2 = -1900;
                platPos.y3 = -1900;
                platPos.y4 = -1900;
                platPos.y5 = -1900;
                breakPlatPos.y1 = -1900;
                colorPlatPos.blueY1 = -1900;
                keyPos.y = -1900;
                goalPos.y = -1900;
                mushPos.y = -1900;
                moldPos.y = -1900;
        // checks level for position
        switch(level){
            case 0:
                playerPos.x = -300;
                playerPos.y = 175;
                platSize.w1 = 300;
                platSize.h1 = 25;
                platSize.w2 = 300;
                platSize.h2 = 25;
                platSize.w3 = 250;
                platSize.h3 = 25;
                platPos.x1 = 270;
                platPos.y1 = 103;
                platPos.x2 = 200;
                platPos.y2 = -60;
                platPos.x3 = -450;
                platPos.y3 = 9;
                breakPlatPos.x1 = -162;
                breakPlatPos.y1 = 1;
                colorPlatPos.blueX1 = -320;
                colorPlatPos.blueY1 = 120;
                goalPos.x = 250;
                goalPos.y = -100;
                goalOpen = true;
                keyPos.x = -550;
                keyPos.y = -100;
                mushPos.x = -100;
                mushPos.y = 190;
                moldPos.x1 = 150;
                moldPos.y = 90;
                moldChainA = 5;
                leverPos.x = -630;
                leverPos.y = -40;
                leverTypeD = 0;
                leverTypeU = 1;
                break;
            case 1:
                playerPos.x = -250;
                playerPos.y = -50;
                platSize.w1 = 130;
                platSize.h1 = 50;
                platSize.w2 = 80;
                platSize.h2 = 30;
                platSize.w3 = 80;
                platSize.h3 = 30;
                platSize.w4 = 130;
                platSize.h4 = 50;
                platPos.x1 = -250;
                platPos.y1 = 5;
                platPos.x2 = -75;
                platPos.y2 = 0;
                platPos.x3 = 75;
                platPos.y3 = 0;
                platPos.x4 = 250;
                platPos.y4 = 5;
                goalPos.x = -350;
                goalPos.y = -100;
                goalOpen = false;
                leverPos.x = 1050;
                leverPos.y = -220;
                leverTypeD = 0;
                leverTypeU = 1;
                break;
            case 2:
                playerPos.x = 0;
                playerPos.y = 175;
                platPos.x1 = -300;
                platPos.y1 = 150;
                platPos.x2 = 300;
                platPos.y2 = 150;
                platPos.x3 = 0;
                platPos.y3 = -100;
                breakPlatPos.x1 = 400;
                breakPlatPos.y1 = 20;
                colorPlatPos.blueX1 = 300;
                colorPlatPos.blueY1 = -50;
                keyPos.x = 250;
                keyPos.y = -100;
                goalPos.x = 0;
                goalPos.y = -190;
                goalOpen = false;
                mushPos.x = -220;
                mushPos.y = 70;
                moldPos.x1 = -130;
                moldPos.y = -112;
                moldChainA = 3;
                leverPos.x = 1050;
                leverPos.y = -220;
                leverTypeD = 2;
                leverTypeU = 0;
                break;
            case 3:

                break;
        }
        // move player
        player.setPosition(sky.x + playerPos.x, sky.y + playerPos.y);

        // goal
        goal.setPosition(sky.x + goalPos.x, sky.y + goalPos.y, 'goal');
        if (goalOpen){
            goal.setFrame(0);
        } else {
            goal.setFrame(1);
        }

        // key
        key.setPosition(sky.x + keyPos.x, sky.y + keyPos.y, 'key');

        // mushroom spring
        mushroom.setPosition(sky.x + mushPos.x, sky.y + mushPos.y, 'mushroom');

        // main ground
        platforms.create(sky.x, (sky.y + sky.displayHeight/2 - 20), 'ground').setDisplaySize(936, 40).refreshBody();

        // other platforms
        plat1 = platforms.create(sky.x + platPos.x1, sky.y + platPos.y1, 'ground').setDisplaySize(platSize.w1, platSize.h1).refreshBody();
        plat2 = platforms.create(sky.x + platPos.x2, sky.y + platPos.y2, 'ground').setDisplaySize(platSize.w2, platSize.h2).refreshBody();
        plat3 = platforms.create(sky.x + platPos.x3, sky.y + platPos.y3, 'ground').setDisplaySize(platSize.w3, platSize.h3).refreshBody();
        plat4 = platforms.create(sky.x + platPos.x4, sky.y + platPos.y4, 'ground').setDisplaySize(platSize.w4, platSize.h4).refreshBody();
        plat5 = platforms.create(sky.x + platPos.x5, sky.y + platPos.y5, 'ground').setDisplaySize(platSize.w5, platSize.h5).refreshBody();
        plat6 = platforms.create(sky.x + platPos.x6, sky.y + platPos.y6, 'ground').setDisplaySize(platSize.w6, platSize.h6).refreshBody();
        plat7 = platforms.create(sky.x + platPos.x7, sky.y + platPos.y7, 'ground').setDisplaySize(platSize.w7, platSize.h7).refreshBody();
        plat8 = platforms.create(sky.x + platPos.x8, sky.y + platPos.y8, 'ground').setDisplaySize(platSize.w8, platSize.h8).refreshBody();


        // breakaway platforms
        breakPlat1.setPosition(sky.x + breakPlatPos.x1, sky.y + breakPlatPos.y1, 'breakPlat');

        // color platforms
        colorPlatCheck();

        // mold
        let moldAtexture3 = 'mold';
        let moldAtexture4 = 'mold';
        let moldAtexture5 = 'mold';

        moldPos.x2 = (moldPos.x1 + 24);
        moldPos.x3 = (moldPos.x2 + 24);
        moldPos.x4 = (moldPos.x3 + 24);
        moldPos.x5 = (moldPos.x4 + 24);

        if (moldChainA <= 3){
            moldAtexture3 = 'moldEdge';
        } else {
            moldAtexture3 = 'mold';
        }
        if (moldChainA === 4){
            moldAtexture4 = 'moldEdge';
        } else {
            moldAtexture4 = 'mold';
        }
        if (moldChainA >= 5){
            moldAtexture5 = 'moldEdge';
        } else {
            moldAtexture5 = 'mold';
        }
        mold.create(sky.x + moldPos.x1, sky.y + moldPos.y, 'moldEdge').setFlipX(true);
        mold.create(sky.x + moldPos.x2, sky.y + moldPos.y, 'mold');
        mold.create(sky.x + moldPos.x3, sky.y + moldPos.y, moldAtexture3);
        rightMold = moldPos.x3;
        if (moldChainA >= 4){
        mold.create(sky.x + moldPos.x4, sky.y + moldPos.y, moldAtexture4);
        rightMold = moldPos.x4;
        }
        if (moldChainA >= 5){
        mold.create(sky.x + moldPos.x5, sky.y + moldPos.y, moldAtexture5);
        rightMold = moldPos.x5;
        }

        //EXTERNAL
        leverDir = 'up';
        lever.setFrame(0);
        lever.setPosition(sky.x + leverPos.x, sky.y + leverPos.y, 'lever');
        leverIconD.setPosition(sky.x + leverPos.x, sky.y + leverPos.y+135, 'leverIcon');
        leverIconD.setFrame(leverTypeD);
        leverIconU.setPosition(sky.x + leverPos.x, sky.y + leverPos.y-135, 'leverIcon');
        leverIconU.setFrame(leverTypeU);

        // refresh collison hitboxes
        breakPlat1.refreshBody();
        mushroom.refreshBody();
        goal.refreshBody();
        key.refreshBody();
    }

    function colorPlatCheck(){
        bluePlatforms.clear(true, true);
        if (extRules.colorBlue === true){
            blueCollider.active = true;
            bluePlatforms.create(sky.x + colorPlatPos.blueX1, sky.y + colorPlatPos.blueY1, 'colorPlat').setTint(0x0062ff);
        } else {
            blueCollider.active = false;
            bluePlatforms.create(sky.x + colorPlatPos.blueX1, sky.y + colorPlatPos.blueY1, 'colorPlat').setTint(0x6ea6ff);
        }
    }

    function springUp(){
        if (player.body.touching.down && mushroom.body.touching.up && player.y <= (mushroom.y - mushroom.height/2)){
            player.setVelocityY(-700);
            cJump = false;
        }
    }

    function moldTouch(){
        player.x = safeSpotX;
        player.y = (safeSpotY-5);
        player.setVelocityY(0);
    }

    function update(){
        // MOVEMENT WALKING
        if (cursors.left.isDown){
            player.setVelocityX(-190);
            player.anims.play('left', true);
        }
        else if (cursors.right.isDown){
            player.setVelocityX(190);
            player.anims.play('right', true);
        }
        else{
            player.setVelocityX(0);
            player.anims.play('front', true);
        }

        // SAFESPOT
        // safespot only taken if player is far enough from mold edge
        if (player.body.touching.down && ((player.x <= (moldPos.x1 - 12 - 100)) || (player.x >= (rightMold + 12 + 100))) && !breakPlat1Touched){
            safeSpotX = player.x;
            safeSpotY = player.y;
        }

        // FALLS IN PIT
        if (player.y >= (sky.y + sky.displayHeight/2) && player.x <= (sky.x + sky.displayWidth/2) && player.x >= (sky.x - sky.displayWidth/2) 
            || player.y >= (sky.y + sky.displayHeight/2 + 200)){
            player.x = safeSpotX;
            player.y = (safeSpotY-5);
            player.setVelocityY(0);
        }
     
        // JUMP
        if (cursors.up.isDown && (player.body.touching.down || cJump === true)){
            if (extRules.shrink){
                player.setVelocityY(-425);
            } else {
                player.setVelocityY(-400);
            }
            cJump = false;
        }

        if (extRules.doubleJump && cursors.up.isUp && !player.body.touching.down){
            doubleJumpAv = true;
        }

        // SHRINK
        if (extRules.shrink){
            player.setScale(1);
        } else {
            player.setScale(1.5);
        }

        // DOUBLE JUMP
        if (cursors.up.isDown && !player.body.touching.down && doubleJumpAv && !doubleJumpStop && extRules.doubleJump){
            player.setVelocityY(-400);
            cJump = false;
            doubleJumpAv = false;
            doubleJumpStop = true;
        }

        // coyote jump. If player is NOT touching down
        if (!player.body.touching.down){
            // coyote jump timer
            // "=>" go to these commands
            this.time.delayedCall(100, () => {
                cJump = false;
            })
        }

        if (player.body.touching.down){
            cJump = true;
            doubleJumpAv = false;
            doubleJumpStop = false;
        }

        // BREAKAWAY PLATFORMS
        // -30 accounts for bounce
        if (!onBreakPlat && breakPlat1Touched && 
        (player.y <= (breakPlat1.y - breakPlat1.height/2 - 30) || 
        player.y >= (breakPlat1.y + breakPlat1.width/2) ||
        player.x >= (breakPlat1.x + breakPlat1.width/2) || 
        player.x <= (breakPlat1.x - breakPlat1.width/2)
        )
        ){
            breakPlat1.disableBody(true,true);
            breakPlat1Touched = false;
        }
        onBreakPlat = false;

        // LEVER PROXIMITY
        if (player.x <= (lever.x+lever.width/2 + 10) &&
            player.x >= (lever.x-lever.width/2 - 10) &&
            player.y <= (lever.y+lever.height/2) &&
            player.y >= (lever.y-lever.height/2 - 20)
            ){
                leverInt = true;
            }
            else{
                lever.clearTint();
                leverInt = false;
            }

        if (leverInt === true){
            lever.setTint('0xffe799');
        }

        if (leverInt === true && Phaser.Input.Keyboard.JustDown(enterKey)){
            if (leverDir === 'up'){
                lever.setFrame(1);
                leverDir = 'down';
            }
            else if (leverDir === 'down'){
                lever.setFrame(0);
                leverDir = 'up';
            }
            leverFlipped();
        }


        // TESTS
        if (Phaser.Input.Keyboard.JustDown(zeroKey)){
            extRules.colorBlue = !extRules.colorBlue;
            colorPlatCheck();
        }

        testText.setText ('Blue: ' + extRules.colorBlue);
        cursorText.setText ('Mouse: ' + this.input.activePointer.x + ', ' + this.input.activePointer.y);

        // console.log('extRules.doubleJump', extRules.doubleJump, doubleJumpAv);
    }
    


</script>

</body>
</html>
